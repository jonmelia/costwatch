[project]
name = "costwatch"
version = "1.0.1"
description = "Find wasted AWS spend: idle and orphaned resources with estimated monthly cost"
readme = "README.md"
authors = [
    { name = "jonnym", email = "26524200+jonmelia@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["aws", "finops", "cost", "cloud", "waste", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.43.110",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[ec2,elb,elbv2,rds,server,cloudwatch,logs,autoscaling,s3]>=5.2.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[project.urls]
Repository = "https://github.com/jonmelia/costwatch"
Issues = "https://github.com/jonmelia/costwatch/issues"
Changelog = "https://github.com/jonmelia/costwatch/blob/main/CHANGELOG.md"

[project.scripts]
costwatch = "costwatch.cli:run"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["costwatch"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
