name: Release

on:
  release:
    types: [published]
  # Used by auto-release.yml: releases created with GITHUB_TOKEN don't trigger the event above
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.0.2
        required: true
      dry_run:
        description: Build and check everything, but don't publish to PyPI
        type: boolean
        default: false
      ref:
        description: Commit to build instead of the tag (for dry runs of a version not tagged yet)
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Check the tag matches the package version
        run: |
          version="v$(uv version --short)"
          if [ "$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match pyproject version $version" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/costwatch
    permissions:
      id-token: write  # trusted publishing: no PyPI token stored anywhere
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify-download:
    # Dry runs still prove the artifact round trip works
    needs: build
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - run: ls -l dist/ && test -n "$(ls dist/*.whl)"
