name: Update prices

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC
  workflow_dispatch:

# Runs share the prices/update branch, so never overlap
concurrency:
  group: update-prices
  cancel-in-progress: false

# The PR is opened and merged with a token for the costwatch-prices GitHub App instead: CI doesn't
# run on a PR opened with GITHUB_TOKEN, and a merge made with it doesn't start the auto release
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - name: Keep last week's prices for comparison
        run: cp src/costwatch/data/prices.json.gz "$RUNNER_TEMP/old-prices.json.gz"
      - run: uv run python scripts/update_prices.py --workers 8
      # Test before opening a PR, so broken prices never reach one
      - run: uv run pytest -q
      - name: Compare with last week
        id: compare
        run: |
          {
            echo "Weekly refresh from the public AWS price list (\`scripts/update_prices.py\`)."
            echo
          } > "$RUNNER_TEMP/body.md"
          set +e
          uv run python scripts/compare_prices.py \
            "$RUNNER_TEMP/old-prices.json.gz" src/costwatch/data/prices.json.gz >> "$RUNNER_TEMP/body.md"
          status=$?
          set -e
          echo "safe=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Bump the patch version for a prices release
        id: bump
        run: |
          if [ -z "$(git status --porcelain -- src/costwatch/data/prices.json.gz)" ]; then
            echo "Prices unchanged"
            exit 0
          fi
          uv version --bump patch
          uv run python scripts/prepare_price_release.py
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.PRICES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRICES_APP_PRIVATE_KEY }}
      # Opens a PR when prices changed, or updates the open one; does nothing if unchanged
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          token: ${{ steps.app.outputs.token }}
          branch: prices/update
          add-paths: |
            src/costwatch/data/prices.json.gz
            pyproject.toml
            uv.lock
            CHANGELOG.md
          commit-message: Update AWS prices (${{ steps.bump.outputs.version }})
          title: Update AWS prices (${{ steps.bump.outputs.version }})
          body-path: ${{ runner.temp }}/body.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
      # Tests passed above and prices moved normally: merge once CI passes, without waiting for a person
      - name: Merge automatically
        if: steps.pr.outputs.pull-request-number && steps.compare.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          # CI takes a moment to report its checks on the new commit
          for _ in $(seq 30); do
            [ "$(gh pr checks "$PR" --required --json name --jq length 2>/dev/null || echo 0)" -gt 0 ] && break
            sleep 10
          done
          gh pr checks "$PR" --required --watch --fail-fast --interval 30
          # Only ever merge the commit this job made and tested, never anything pushed since
          gh pr merge "$PR" --squash --delete-branch \
            --match-head-commit "${{ steps.pr.outputs.pull-request-head-sha }}"
      - name: Leave for review
        if: steps.pr.outputs.pull-request-number && steps.compare.outputs.safe != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh label create "needs review" --color D93F0B --force \
            --description "Unusual price changes; check before merging"
          gh pr edit "${{ steps.pr.outputs.pull-request-number }}" --add-label "needs review"
