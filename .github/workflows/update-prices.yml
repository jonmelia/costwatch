name: Update prices

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Keep last week's prices for comparison
        run: cp src/costwatch/data/prices.json.gz "$RUNNER_TEMP/old-prices.json.gz"
      - run: uv run python scripts/update_prices.py --workers 8
      # PRs opened with GITHUB_TOKEN don't trigger CI, so test here
      - run: uv run pytest -q
      - name: Compare with last week
        id: compare
        run: |
          {
            echo "Weekly refresh from the public AWS price list (\`scripts/update_prices.py\`)."
            echo
          } > "$RUNNER_TEMP/body.md"
          set +e
          uv run python scripts/compare_prices.py \
            "$RUNNER_TEMP/old-prices.json.gz" src/costwatch/data/prices.json.gz >> "$RUNNER_TEMP/body.md"
          status=$?
          set -e
          echo "safe=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      # Opens a PR when prices changed, or updates the open one; does nothing if unchanged
      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          branch: prices/update
          add-paths: src/costwatch/data/prices.json.gz
          commit-message: Update AWS prices
          title: Update AWS prices
          body-path: ${{ runner.temp }}/body.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
      # Tests passed above and prices moved normally: merge without waiting for a person
      - name: Merge automatically
        if: steps.pr.outputs.pull-request-number && steps.compare.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch
      - name: Leave for review
        if: steps.pr.outputs.pull-request-number && steps.compare.outputs.safe != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "needs review" --color D93F0B --force \
            --description "Unusual price changes; check before merging"
          gh pr edit "${{ steps.pr.outputs.pull-request-number }}" --add-label "needs review"
