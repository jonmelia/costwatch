name: Update prices

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC
  workflow_dispatch:

# Runs share the prices/update branch, so never overlap
concurrency:
  group: update-prices
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write  # to start the auto release after merging

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - name: Keep last week's prices for comparison
        run: cp src/costwatch/data/prices.json.gz "$RUNNER_TEMP/old-prices.json.gz"
      - run: uv run python scripts/update_prices.py --workers 8
      # PRs opened with GITHUB_TOKEN don't trigger CI, so test here
      - run: uv run pytest -q
      - name: Compare with last week
        id: compare
        run: |
          {
            echo "Weekly refresh from the public AWS price list (\`scripts/update_prices.py\`)."
            echo
          } > "$RUNNER_TEMP/body.md"
          set +e
          uv run python scripts/compare_prices.py \
            "$RUNNER_TEMP/old-prices.json.gz" src/costwatch/data/prices.json.gz >> "$RUNNER_TEMP/body.md"
          status=$?
          set -e
          echo "safe=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Bump the patch version for a prices release
        id: bump
        run: |
          if [ -z "$(git status --porcelain -- src/costwatch/data/prices.json.gz)" ]; then
            echo "Prices unchanged"
            exit 0
          fi
          uv version --bump patch
          uv run python scripts/prepare_price_release.py
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      # Opens a PR when prices changed, or updates the open one; does nothing if unchanged
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        id: pr
        with:
          branch: prices/update
          add-paths: |
            src/costwatch/data/prices.json.gz
            pyproject.toml
            uv.lock
            CHANGELOG.md
          commit-message: Update AWS prices (${{ steps.bump.outputs.version }})
          title: Update AWS prices (${{ steps.bump.outputs.version }})
          body-path: ${{ runner.temp }}/body.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
      # main requires CI's checks, but a PR opened with GITHUB_TOKEN doesn't start CI, so start
      # it on the PR's commit directly; its checks count for the PR all the same
      - name: Run CI on the PR
        id: ci
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          gh workflow run ci.yml --ref prices/update
          for _ in $(seq 30); do
            run_id=$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$SHA" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "The CI run for $SHA didn't start" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      # Tests passed above and prices moved normally: merge once CI passes, without waiting for a person
      - name: Merge automatically
        if: steps.pr.outputs.pull-request-number && steps.compare.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch "${{ steps.ci.outputs.run-id }}" --exit-status --interval 30 > /dev/null
          # Only ever merge the commit this job made and tested, never anything pushed since
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch \
            --match-head-commit "${{ steps.pr.outputs.pull-request-head-sha }}"
          # A merge made with GITHUB_TOKEN doesn't trigger other workflows, so start it directly
          gh workflow run auto-release.yml --ref main
      - name: Leave for review
        if: steps.pr.outputs.pull-request-number && steps.compare.outputs.safe != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "needs review" --color D93F0B --force \
            --description "Unusual price changes; check before merging"
          gh pr edit "${{ steps.pr.outputs.pull-request-number }}" --add-label "needs review"
