name: Update prices

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python scripts/update_prices.py --workers 8
      # PRs opened with GITHUB_TOKEN don't trigger CI, so test here
      - run: uv run pytest -q
      # Opens a PR when prices changed, or updates the open one; does nothing if unchanged
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: prices/update
          add-paths: src/costwatch/data/prices.json.gz
          commit-message: Update AWS prices
          title: Update AWS prices
          body: Weekly refresh from the public AWS price list (`scripts/update_prices.py`).
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          delete-branch: true
