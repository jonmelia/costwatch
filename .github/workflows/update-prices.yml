name: Update prices

on:
  schedule:
    - cron: "0 6 2 * *"  # monthly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python scripts/update_prices.py --workers 8
      # PRs opened with GITHUB_TOKEN don't trigger CI, so test here
      - run: uv run pytest -q
      - name: Open a pull request if prices changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- src/costwatch/data/prices.json.gz)" ]; then
            echo "Prices unchanged"
            exit 0
          fi
          branch="prices/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/costwatch/data/prices.json.gz
          git commit -m "Update AWS prices"
          git push -u origin "$branch"
          gh pr create --base main --title "Update AWS prices" \
            --body "Monthly refresh from the public AWS price list (scripts/update_prices.py)."
