name: Auto release

# Releases whenever a new version lands on main: a version bump in pyproject.toml, or updated
# prices (the weekly price job bumps the version). Pushes that don't change the version find its
# tag already exists and do nothing. The price job dispatches this after auto-merging (its merge
# can't trigger `push` itself); anything merged by a person triggers it through `push`.
on:
  push:
    branches: [main]
    paths: [pyproject.toml, src/costwatch/data/prices.json.gz]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Don't create the release; run the release workflow as a dry run
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Work out the version
        id: version
        run: |
          tag="v$(uv version --short)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released"
          fi
      - name: Create the GitHub release
        if: steps.version.outputs.released != 'true' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v v="## [${TAG#v}]" 'index($0, v) == 1 {f = 1; next} /^## \[/ {f = 0} f' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no entry for ${TAG#v}; add one before releasing" >&2
            exit 1
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Publish to PyPI
        if: steps.version.outputs.released != 'true' || env.DRY_RUN == 'true'
        run: |
          # A dry run of an unreleased version has no tag yet, so build the exact commit instead
          ref=""
          if [ "$DRY_RUN" = "true" ] && [ "${{ steps.version.outputs.released }}" != "true" ]; then
            ref="$(git rev-parse HEAD)"
          fi
          gh workflow run release.yml --ref main \
            -f tag="${{ steps.version.outputs.tag }}" -f dry_run="$DRY_RUN" -f ref="$ref"
          echo "Started the Release workflow for ${{ steps.version.outputs.tag }} (dry run: $DRY_RUN)"
